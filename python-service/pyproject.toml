[project]
name = "cohesive-backend"
version = "1.0.0"
description = "Unified FastAPI backend for Cohesive app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "supabase>=2.27.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "langchain-groq>=1.1.1",
    "langchain-core>=0.3.0",
    "huggingface-hub>=1.3.1",
    "numpy>=2.4.1",
    "scipy>=1.17.0",
    "requests>=2.32.5",
    "pydantic>=2.0.0",
]

[project.scripts]
start = "uvicorn main:app --host 0.0.0.0 --port 3001 --reload"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
